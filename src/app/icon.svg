<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- The brand mark, drawn as an instrument: one radius, hairlines, two
       accents with jobs. Flat fills only. DESIGN.md §8.1, §13. -->
  <rect width="32" height="32" rx="3" fill="#06090f"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="2.5" stroke="#1b2536"/>

  <!-- lens aperture: the 26px ring of the wordmark, scaled -->
  <circle cx="16" cy="16" r="11" stroke="#2b7a86"/>
  <circle cx="16" cy="16" r="8" stroke="#5ec9d6" stroke-opacity="0.28"/>

  <!-- four long ticks at the cardinal branches -->
  <path d="M16 3v2M16 27v2M3 16h2M27 16h2" stroke="#5ec9d6" stroke-opacity="0.75"/>

  <!-- ✦ — a star, so it is amber -->
  <path
    d="M16 7 L17 15 L25 16 L17 17 L16 25 L15 17 L7 16 L15 15 Z"
    fill="#e8b25a"
  />
</svg>
