<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#060a13"/>

  <!-- Outer glow ring -->
  <circle cx="16" cy="16" r="12" stroke="#3b5bdb" stroke-width="0.5" stroke-opacity="0.4"/>

  <!-- Gradient defs -->
  <defs>
    <linearGradient id="starGrad" x1="8" y1="8" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5b8af5"/>
      <stop offset="50%" stop-color="#9775cd"/>
      <stop offset="100%" stop-color="#e8b339"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Four-pointed star (✦) -->
  <path
    d="M16 5 L17.2 14.8 L27 16 L17.2 17.2 L16 27 L14.8 17.2 L5 16 L14.8 14.8 Z"
    fill="url(#starGrad)"
    filter="url(#glow)"
  />

  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="#e8b339" opacity="0.9"/>
</svg>
